[ids]
*

include home-row-mods
include shared-layers

[main]
# Use the physical Alt keys for editing; home-row s/k continue to provide Alt.
leftalt = backspace
rightalt = delete

# Temporary: disable the legacy physical keys to force new-layout muscle memory.
# Remove these bindings once the new editing and navigation habits are established.
# backspace = noop
# delete = noop
# enter = noop
# grave = noop
# left = noop
# down = noop
# up = noop
# right = noop

# Swap physical Caps Lock and Escape.
capslock = esc
esc = capslock

# Use the physical Shift keys for brackets; home-row d/j continue to provide Shift.
leftshift = leftbrace
rightshift = rightbrace
