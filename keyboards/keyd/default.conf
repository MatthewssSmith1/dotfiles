[ids]
*

include home-row-mods
include shared-layers

[main]
leftalt = backspace
rightalt = delete
capslock = esc
esc = capslock
leftshift = leftbrace
rightshift = rightbrace
# Shift the right-hand letters, retaining the moved punctuation keys.
y = backslash
u = y
i = u
o = i
p = o
leftbrace = p
rightbrace = backslash
h = semicolon
j = overloadt(control, h, 200)
k = overloadt(shift, j, 180)
l = overloadt(alt, k, 200)
semicolon = overloadt(meta, l, 200)
n = overloadt(symbols, slash, 200)
m = overloadt(symbols, n, 200)
comma = overloadt(symbols, m, 200)
dot = overloadt(symbols, comma, 200)
slash = overloadt(symbols, dot, 200)
